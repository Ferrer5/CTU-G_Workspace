<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('ctug-theme');
          var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (dark) root.classList.add('dark');
          if (pref === 'dark') root.classList.add('theme-black');
          root.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e8c72" />
    <meta name="description" content="CTU-G Workspace - Campus Services Portal" />
    <title>CTU-G Workspace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
